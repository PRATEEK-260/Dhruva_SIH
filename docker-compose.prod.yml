# Production override for a single small VM (1 GB RAM + swap).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --wait
#
# Images are built on a workstation and shipped with deploy/push.sh; a 1 GB box
# runs out of memory installing the geo/data stack. Measured on the full stack
# after a real /advisory: api 156 MB, titiler 151, postgres 75, caddy 16, redis 11.

services:
  postgres:
    # Never publish the database on a public host.
    ports: !reset []
    mem_limit: 300m
    restart: unless-stopped

  redis:
    ports: !reset []
    mem_limit: 64m
    restart: unless-stopped

  api:
    environment:
      ENV: prod
    # Run the code baked into the image, not a bind mount of a checkout, and
    # without --reload's extra watcher process.
    command: ["uvicorn", "dhruva.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes: !override
      - ./data:/app/data:ro
    ports: !reset []
    mem_limit: 450m
    restart: unless-stopped

  titiler:
    ports: !reset []
    mem_limit: 350m
    restart: unless-stopped

  caddy:
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. 140-238-1-2.sslip.io}
    volumes: !override
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddydata:/data
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api: {condition: service_healthy}
      titiler: {condition: service_healthy}
    restart: unless-stopped
