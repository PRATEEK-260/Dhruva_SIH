language: ta
band:
  0: உங்கள் படகுக்கான வரம்புக்குள் நிலைமை உள்ளது.
  1: கவனமாக இருங்கள்.
  2: கடலுக்குச் செல்ல வேண்டாம்.
  3: எந்த ஆலோசனையும் வழங்க முடியாது.
evidence:
  "0.0": எந்த ஆபத்தும் பதிவாகவில்லை.
  "0.1": அலை உயரம் {wave_hs_m} மீட்டர்.
  "0.2": காற்று {wind_kt} முடிச்சு.
  "1.0": உங்கள் படகுக்கான வரம்பை நிலைமை நெருங்கிவிட்டது.
  "1.1": அலை உயரம் {wave_hs_m} மீட்டர், உங்கள் படகுக்கான வரம்பை நெருங்கிவிட்டது.
  "1.2": காற்று {wind_kt} முடிச்சு, உங்கள் படகுக்கான வரம்பை நெருங்கிவிட்டது.
  "2.0": உங்கள் படகுக்கான வரம்பை நிலைமை தாண்டிவிட்டது.
  "2.1": அலை உயரம் {wave_hs_m} மீட்டர், உங்கள் படகுக்கான வரம்பைத் தாண்டிவிட்டது.
  "2.2": காற்று {wind_kt} முடிச்சு, உங்கள் படகுக்கான வரம்பைத் தாண்டிவிட்டது.
  "2.3": உங்கள் அருகில் புயல் எச்சரிக்கை அமலில் உள்ளது.
  "2.4": உங்கள் அருகில் மின்னல் பதிவாகியுள்ளது.
  "2.5": சுனாமி எச்சரிக்கை அமலில் உள்ளது. கரையிலிருந்து விலகிச் செல்லுங்கள்.
  "3.0": நிலைமையை உறுதிப்படுத்த முடியவில்லை. கடலுக்குச் செல்வதற்கு முன் அதிகாரப்பூர்வ அறிக்கையைப் பாருங்கள்.
  "3.6": தீர்ப்புக்குத் தேவையான ஒரு அளவீடு கிடைக்கவில்லை. கடலுக்குச் செல்வதற்கு முன் அதிகாரப்பூர்வ அறிக்கையைப் பாருங்கள்.
modifier:
  1: இந்த அளவீடு அளவுகோலின் உச்சத்தில் உள்ளது. உண்மையான மதிப்பு இதைவிட அதிகமாக இருக்கலாம்.
  2: நீங்கள் {bnd_type_name} இலிருந்து {bnd_dist_nm} கடல் மைல் தொலைவில் உள்ளீர்கள், தற்போதைய நகர்வில் சுமார் {bnd_eta_min} நிமிடம்.
  3: மீன்பிடி மண்டலம் {pfz_bearing_name} திசையில் {pfz_dist_nm} கடல் மைல் தொலைவில் உள்ளது.
  4: அருகில் மீன்பிடி மண்டலம் உள்ளது, ஆனால் கடல் நிலைமையே முதன்மையானது.
  5: உடனடியாக அருகிலுள்ள துறைமுகத்திற்குத் திரும்புங்கள்.
  6: இந்த வரம்புகள் தற்காலிகமானவை, அதிகாரப்பூர்வ அளவுகோல்கள் அல்ல.
