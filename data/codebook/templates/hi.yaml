  "2.4": आपके पास बिजली गिरने की सूचना है।
  "2.5": सुनामी की चेतावनी लागू है। तट से दूर चले जाएँ।
  "3.0": स्थिति की पुष्टि नहीं हो सकी। समुद्र में जाने से पहले आधिकारिक बुलेटिन देखें।
  "3.6": निर्णय के लिए आवश्यक एक माप उपलब्ध नहीं था। समुद्र में जाने से पहले आधिकारिक बुलेटिन देखें।
modifier:
  1: यह माप अपने पैमाने के शिखर पर है। वास्तविक मान इससे अधिक हो सकता है।
  2: आप {bnd_type_name} से {bnd_dist_nm} समुद्री मील दूर हैं, वर्तमान बहाव पर लगभग {bnd_eta_min} मिनट।
  3: मछली क्षेत्र {pfz_bearing_name} दिशा में {pfz_dist_nm} समुद्री मील दूर है।
  4: पास में मछली क्षेत्र है, लेकिन समुद्र की स्थिति पहले आती है।
  5: तुरंत निकटतम बंदरगाह लौट जाएँ।
