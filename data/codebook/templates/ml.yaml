language: ml
band:
  0: നിങ്ങളുടെ വള്ളത്തിന് സ്ഥിതി പരിധിക്കുള്ളിലാണ്.
  1: ശ്രദ്ധിക്കുക.
  2: കടലിൽ പോകരുത്.
  3: ഒരു ഉപദേശവും നൽകാൻ കഴിയില്ല.
evidence:
  "0.0": അപകടമൊന്നും രേഖപ്പെടുത്തിയിട്ടില്ല.
  "0.1": തിരയുടെ ഉയരം {wave_hs_m} മീറ്റർ.
  "0.2": കാറ്റ് {wind_kt} നോട്ട്.
  "1.0": സ്ഥിതി നിങ്ങളുടെ വള്ളത്തിന്റെ പരിധിയോട് അടുത്തിരിക്കുന്നു.
  "1.1": തിരയുടെ ഉയരം {wave_hs_m} മീറ്റർ, നിങ്ങളുടെ വള്ളത്തിന്റെ പരിധിയോട് അടുത്ത്.
  "1.2": കാറ്റ് {wind_kt} നോട്ട്, നിങ്ങളുടെ വള്ളത്തിന്റെ പരിധിയോട് അടുത്ത്.
  "2.0": സ്ഥിതി നിങ്ങളുടെ വള്ളത്തിന്റെ പരിധി കടന്നിരിക്കുന്നു.
  "2.1": തിരയുടെ ഉയരം {wave_hs_m} മീറ്റർ, നിങ്ങളുടെ വള്ളത്തിന്റെ പരിധി കടന്നു.
  "2.2": കാറ്റ് {wind_kt} നോട്ട്, നിങ്ങളുടെ വള്ളത്തിന്റെ പരിധി കടന്നു.
  "2.3": നിങ്ങൾക്ക് അടുത്ത് ചുഴലിക്കാറ്റ് മുന്നറിയിപ്പ് നിലവിലുണ്ട്.
  "2.4": നിങ്ങൾക്ക് അടുത്ത് ഇടിമിന്നൽ രേഖപ്പെടുത്തിയിട്ടുണ്ട്.
  "2.5": സുനാമി മുന്നറിയിപ്പ് നിലവിലുണ്ട്. തീരത്തുനിന്ന് അകന്നു പോകുക.
  "3.0": സ്ഥിതി സ്ഥിരീകരിക്കാൻ കഴിഞ്ഞില്ല. കടലിൽ പോകുന്നതിന് മുമ്പ് ഔദ്യോഗിക ബുള്ളറ്റിൻ കാണുക.
  "3.6": തീരുമാനത്തിന് ആവശ്യമായ ഒരു അളവ് ലഭ്യമായിരുന്നില്ല. കടലിൽ പോകുന്നതിന് മുമ്പ് ഔദ്യോഗിക ബുള്ളറ്റിൻ കാണുക.
modifier:
  1: ഈ അളവ് അതിന്റെ സ്കെയിലിന്റെ മുകൾഭാഗത്താണ്. യഥാർത്ഥ മൂല്യം ഇതിലും കൂടുതലാകാം.
  2: നിങ്ങൾ {bnd_type_name} നിന്ന് {bnd_dist_nm} നോട്ടിക്കൽ മൈൽ അകലെയാണ്, ഇപ്പോഴത്തെ നീക്കത്തിൽ ഏകദേശം {bnd_eta_min} മിനിറ്റ്.
  3: മത്സ്യബന്ധന മേഖല {pfz_bearing_name} ദിശയിൽ {pfz_dist_nm} നോട്ടിക്കൽ മൈൽ അകലെയാണ്.
  4: അടുത്ത് മത്സ്യബന്ധന മേഖലയുണ്ട്, പക്ഷേ കടലിന്റെ സ്ഥിതിയാണ് ആദ്യം.
  5: ഉടൻ അടുത്തുള്ള തുറമുഖത്തേക്ക് മടങ്ങുക.
  6: ഈ പരിധികൾ താൽക്കാലികമാണ്, ഔദ്യോഗിക മാനദണ്ഡങ്ങളല്ല.
