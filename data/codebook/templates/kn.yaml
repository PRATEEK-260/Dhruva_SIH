language: kn
band:
  0: ನಿಮ್ಮ ದೋಣಿಗೆ ಪರಿಸ್ಥಿತಿ ಮಿತಿಯೊಳಗಿದೆ.
  1: ಎಚ್ಚರಿಕೆಯಿಂದಿರಿ.
  2: ಸಮುದ್ರಕ್ಕೆ ಹೋಗಬೇಡಿ.
  3: ಯಾವುದೇ ಸಲಹೆ ನೀಡಲು ಸಾಧ್ಯವಿಲ್ಲ.
evidence:
  "0.0": ಯಾವುದೇ ಅಪಾಯ ದಾಖಲಾಗಿಲ್ಲ.
  "0.1": ಅಲೆಯ ಎತ್ತರ {wave_hs_m} ಮೀಟರ್.
  "0.2": ಗಾಳಿ {wind_kt} ನಾಟ್.
  "1.0": ಪರಿಸ್ಥಿತಿ ನಿಮ್ಮ ದೋಣಿಯ ಮಿತಿಗೆ ಹತ್ತಿರವಾಗಿದೆ.
  "1.1": ಅಲೆಯ ಎತ್ತರ {wave_hs_m} ಮೀಟರ್, ನಿಮ್ಮ ದೋಣಿಯ ಮಿತಿಗೆ ಹತ್ತಿರ.
  "1.2": ಗಾಳಿ {wind_kt} ನಾಟ್, ನಿಮ್ಮ ದೋಣಿಯ ಮಿತಿಗೆ ಹತ್ತಿರ.
  "2.0": ಪರಿಸ್ಥಿತಿ ನಿಮ್ಮ ದೋಣಿಯ ಮಿತಿಯನ್ನು ಮೀರಿದೆ.
  "2.1": ಅಲೆಯ ಎತ್ತರ {wave_hs_m} ಮೀಟರ್, ನಿಮ್ಮ ದೋಣಿಯ ಮಿತಿಯನ್ನು ಮೀರಿದೆ.
  "2.2": ಗಾಳಿ {wind_kt} ನಾಟ್, ನಿಮ್ಮ ದೋಣಿಯ ಮಿತಿಯನ್ನು ಮೀರಿದೆ.
  "2.3": ನಿಮ್ಮ ಹತ್ತಿರ ಚಂಡಮಾರುತದ ಎಚ್ಚರಿಕೆ ಜಾರಿಯಲ್ಲಿದೆ.
  "2.4": ನಿಮ್ಮ ಹತ್ತಿರ ಸಿಡಿಲು ದಾಖಲಾಗಿದೆ.
  "2.5": ಸುನಾಮಿ ಎಚ್ಚರಿಕೆ ಜಾರಿಯಲ್ಲಿದೆ. ದಡದಿಂದ ದೂರ ಹೋಗಿ.
  "3.0": ಪರಿಸ್ಥಿತಿಯನ್ನು ಖಚಿತಪಡಿಸಲು ಆಗಲಿಲ್ಲ. ಸಮುದ್ರಕ್ಕೆ ಹೋಗುವ ಮೊದಲು ಅಧಿಕೃತ ಬುಲೆಟಿನ್ ನೋಡಿ.
  "3.6": ತೀರ್ಪಿಗೆ ಬೇಕಾದ ಒಂದು ಅಳತೆ ಲಭ್ಯವಿರಲಿಲ್ಲ. ಸಮುದ್ರಕ್ಕೆ ಹೋಗುವ ಮೊದಲು ಅಧಿಕೃತ ಬುಲೆಟಿನ್ ನೋಡಿ.
modifier:
  1: ಈ ಅಳತೆ ತನ್ನ ಮಾಪನದ ಗರಿಷ್ಠದಲ್ಲಿದೆ. ನಿಜವಾದ ಮೌಲ್ಯ ಇದಕ್ಕಿಂತ ಹೆಚ್ಚಿರಬಹುದು.
  2: ನೀವು {bnd_type_name} ಇಂದ {bnd_dist_nm} ನಾಟಿಕಲ್ ಮೈಲಿ ದೂರದಲ್ಲಿದ್ದೀರಿ, ಈಗಿನ ಚಲನೆಯಲ್ಲಿ ಸುಮಾರು {bnd_eta_min} ನಿಮಿಷ.
  3: ಮೀನುಗಾರಿಕೆ ವಲಯ {pfz_bearing_name} ದಿಕ್ಕಿನಲ್ಲಿ {pfz_dist_nm} ನಾಟಿಕಲ್ ಮೈಲಿ ದೂರದಲ್ಲಿದೆ.
  4: ಹತ್ತಿರದಲ್ಲಿ ಮೀನುಗಾರಿಕೆ ವಲಯವಿದೆ, ಆದರೆ ಸಮುದ್ರದ ಪರಿಸ್ಥಿತಿಯೇ ಮೊದಲು.
  5: ತಕ್ಷಣ ಹತ್ತಿರದ ಬಂದರಿಗೆ ಹಿಂತಿರುಗಿ.
  6: ಈ ಮಿತಿಗಳು ತಾತ್ಕಾಲಿಕ, ಅಧಿಕೃತ ಮಾನದಂಡಗಳಲ್ಲ.
