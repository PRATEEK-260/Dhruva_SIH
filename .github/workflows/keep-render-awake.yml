name: keep-render-awake

# Render's free web service sleeps after 15 minutes without traffic, and a
# cold start takes about a minute. Scheduled runs are often a few minutes
# late, so ping every 10 minutes rather than 15. 750 free instance hours a
# month cover one service running around the clock.
# Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend
        env:
          RENDER_URL: https://dhruva-api.onrender.com
        run: curl -fsS -m 120 --retry 3 --retry-delay 15 "$RENDER_URL/api/health"
