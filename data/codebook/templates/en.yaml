# English reason templates, keyed b<band>f<family>m<modifier>.
#
# Spoken aloud over engine noise: short, imperative, hazard first. Only reachable
# combinations are authored here; the generator fills the rest from each band's
# b<band>f0m0 generic entry. The advisory notice is appended by the generator, so
# it must not be repeated inline.
#
# No literal digits. Every number comes from a slot bound to a decoded Capsule
# attribute, which is what makes these templates firewall-clean by construction.
language: en

