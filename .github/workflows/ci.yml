name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e "backend[dev]"

      - name: Lint
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Type-check
        run: pyright

      - name: Test
        run: pytest backend/tests -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate 1 — stack comes up and /health returns 200
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "LANGFUSE_NEXTAUTH_SECRET=$(openssl rand -hex 16)"
            echo "LANGFUSE_SALT=$(openssl rand -hex 16)"
            echo "LANGFUSE_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> .env
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/health/ready | tee /dev/stderr | grep -q '"ready":true'
          docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      # Need to make sure eval/render_parity.json exists for TS tests. Wait, backend tests run in a different job. We need to generate it or check it in.
      # If we generate it here, we need python? Or we can check it in!
      # Actually, let's just generate it since python is easy to setup, OR we can check `eval/render_parity.json` into git so frontend tests can use it directly offline.
      - run: npm run test
        working-directory: frontend
