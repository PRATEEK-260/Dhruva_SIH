language: gu
band:
  0: તમારી હોડી માટે સ્થિતિ મર્યાદામાં છે.
  1: સાવધાન રહો.
  2: દરિયામાં ન જાઓ.
  3: કોઈ સલાહ આપી શકાતી નથી.
evidence:
  "0.0": કોઈ જોખમ નોંધાયું નથી.
  "0.1": મોજાંની ઊંચાઈ {wave_hs_m} મીટર.
  "0.2": પવન {wind_kt} નોટ.
  "1.0": સ્થિતિ તમારી હોડીની મર્યાદા નજીક પહોંચી છે.
  "1.1": મોજાંની ઊંચાઈ {wave_hs_m} મીટર, તમારી હોડીની મર્યાદા નજીક.
  "1.2": પવન {wind_kt} નોટ, તમારી હોડીની મર્યાદા નજીક.
  "2.0": સ્થિતિ તમારી હોડીની મર્યાદા વટાવી ગઈ છે.
  "2.1": મોજાંની ઊંચાઈ {wave_hs_m} મીટર, તમારી હોડીની મર્યાદા વટાવી.
  "2.2": પવન {wind_kt} નોટ, તમારી હોડીની મર્યાદા વટાવી.
  "2.3": તમારી નજીક વાવાઝોડાની ચેતવણી અમલમાં છે.
  "2.4": તમારી નજીક વીજળી પડ્યાની નોંધ છે.
  "2.5": સુનામીની ચેતવણી અમલમાં છે. કિનારાથી દૂર જાઓ.
  "3.0": સ્થિતિની ખાતરી થઈ શકી નથી. દરિયામાં જતા પહેલાં અધિકૃત બુલેટિન જુઓ.
  "3.6": નિર્ણય માટે જરૂરી એક માપ ઉપલબ્ધ ન હતું. દરિયામાં જતા પહેલાં અધિકૃત બુલેટિન જુઓ.
modifier:
  1: આ માપ તેના માપદંડની ટોચ પર છે. ખરી કિંમત આના કરતાં વધુ હોઈ શકે.
  2: તમે {bnd_type_name} થી {bnd_dist_nm} દરિયાઈ માઈલ દૂર છો, હાલની ગતિએ આશરે {bnd_eta_min} મિનિટ.
  3: માછીમારી વિસ્તાર {pfz_bearing_name} દિશામાં {pfz_dist_nm} દરિયાઈ માઈલ દૂર છે.
  4: નજીકમાં માછીમારી વિસ્તાર છે, પણ દરિયાની સ્થિતિ પહેલાં આવે છે.
  5: તરત જ નજીકના બંદરે પાછા ફરો.
  6: આ મર્યાદાઓ કામચલાઉ છે, અધિકૃત માપદંડ નથી.
