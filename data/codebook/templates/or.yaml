language: or
band:
  0: ଆପଣଙ୍କ ଡଙ୍ଗା ପାଇଁ ପରିସ୍ଥିତି ସୀମା ଭିତରେ ଅଛି.
  1: ସାବଧାନ ରୁହନ୍ତୁ.
  2: ସମୁଦ୍ରକୁ ଯାଆନ୍ତୁ ନାହିଁ.
  3: କୌଣସି ପରାମର୍ଶ ଦିଆଯାଇପାରିବ ନାହିଁ.
evidence:
  "0.0": କୌଣସି ବିପଦ ଲିପିବଦ୍ଧ ହୋଇନାହିଁ.
  "0.1": ଢେଉର ଉଚ୍ଚତା {wave_hs_m} ମିଟର.
  "0.2": ପବନ {wind_kt} ନଟ୍.
  "1.0": ପରିସ୍ଥିତି ଆପଣଙ୍କ ଡଙ୍ଗାର ସୀମା ନିକଟରେ ପହଞ୍ଚିଛି.
  "1.1": ଢେଉର ଉଚ୍ଚତା {wave_hs_m} ମିଟର, ଆପଣଙ୍କ ଡଙ୍ଗାର ସୀମା ନିକଟରେ.
  "1.2": ପବନ {wind_kt} ନଟ୍, ଆପଣଙ୍କ ଡଙ୍ଗାର ସୀମା ନିକଟରେ.
  "2.0": ପରିସ୍ଥିତି ଆପଣଙ୍କ ଡଙ୍ଗାର ସୀମା ଅତିକ୍ରମ କରିଛି.
  "2.1": ଢେଉର ଉଚ୍ଚତା {wave_hs_m} ମିଟର, ଆପଣଙ୍କ ଡଙ୍ଗାର ସୀମା ଅତିକ୍ରମ କରିଛି.
  "2.2": ପବନ {wind_kt} ନଟ୍, ଆପଣଙ୍କ ଡଙ୍ଗାର ସୀମା ଅତିକ୍ରମ କରିଛି.
  "2.3": ଆପଣଙ୍କ ନିକଟରେ ବାତ୍ୟା ଚେତାବନୀ ଲାଗୁ ଅଛି.
  "2.4": ଆପଣଙ୍କ ନିକଟରେ ବଜ୍ରପାତ ଲିପିବଦ୍ଧ ହୋଇଛି.
  "2.5": ସୁନାମି ଚେତାବନୀ ଲାଗୁ ଅଛି. କୂଳରୁ ଦୂରକୁ ଯାଆନ୍ତୁ.
  "3.0": ପରିସ୍ଥିତି ନିଶ୍ଚିତ କରାଯାଇପାରିଲା ନାହିଁ. ସମୁଦ୍ରକୁ ଯିବା ପୂର୍ବରୁ ସରକାରୀ ବୁଲେଟିନ୍ ଦେଖନ୍ତୁ.
  "3.6": ନିଷ୍ପତ୍ତି ପାଇଁ ଆବଶ୍ୟକ ଏକ ମାପ ଉପଲବ୍ଧ ନଥିଲା. ସମୁଦ୍ରକୁ ଯିବା ପୂର୍ବରୁ ସରକାରୀ ବୁଲେଟିନ୍ ଦେଖନ୍ତୁ.
modifier:
  1: ଏହି ମାପ ଏହାର ମାପକାଠିର ଶୀର୍ଷରେ ଅଛି. ପ୍ରକୃତ ମୂଲ୍ୟ ଏହାଠାରୁ ଅଧିକ ହୋଇପାରେ.
  2: ଆପଣ {bnd_type_name} ଠାରୁ {bnd_dist_nm} ସାମୁଦ୍ରିକ ମାଇଲ ଦୂରରେ ଅଛନ୍ତି, ବର୍ତ୍ତମାନର ଗତିରେ ପ୍ରାୟ {bnd_eta_min} ମିନିଟ୍.
  3: ମତ୍ସ୍ୟ ଅଞ୍ଚଳ {pfz_bearing_name} ଦିଗରେ {pfz_dist_nm} ସାମୁଦ୍ରିକ ମାଇଲ ଦୂରରେ ଅଛି.
  4: ନିକଟରେ ମତ୍ସ୍ୟ ଅଞ୍ଚଳ ଅଛି, କିନ୍ତୁ ସମୁଦ୍ରର ପରିସ୍ଥିତି ପ୍ରଥମେ ଆସେ.
  5: ତୁରନ୍ତ ନିକଟତମ ବନ୍ଦରକୁ ଫେରନ୍ତୁ.
  6: ଏହି ସୀମାଗୁଡ଼ିକ ଅସ୍ଥାୟୀ, ସରକାରୀ ମାନଦଣ୍ଡ ନୁହେଁ.
