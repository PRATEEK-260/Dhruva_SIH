name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv pip install --system -e "backend[dev]"

      - name: Lint
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Type-check
        run: pyright

      - name: Test
        run: pytest backend/tests -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate 1 — stack comes up and /health returns 200
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "LANGFUSE_NEXTAUTH_SECRET=$(openssl rand -hex 16)"
            echo "LANGFUSE_SALT=$(openssl rand -hex 16)"
            echo "LANGFUSE_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> .env
          docker compose up -d --build --wait --wait-timeout 300
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/health/ready | tee /dev/stderr | grep -q '"ready":true'
          docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend

      # eval/render_parity.json (Python's rendering of all 500 corpus capsules
      # in all 12 languages) is checked in for local-dev convenience, but this
      # job regenerates it fresh rather than trusting the checked-in copy — the
      # `backend` job above runs in an independent checkout with no shared
      # filesystem, so its own run of this test does not reach this job. A
      # stale checked-in file would make the parity check compare TypeScript
      # against yesterday's Python output instead of today's, silently
      # defeating the point: CLAUDE.md's capsule section and IMPLEMENTATION.md
      # Gate 4 both require Python and TypeScript to run the SAME corpus in CI.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install backend (for the Python side of the parity check)
        run: uv pip install --system -e "backend[dev]"
      - name: Regenerate the cross-language parity fixture
        run: pytest backend/tests/test_codebook_languages.py -k test_every_corpus_capsule_renders_in_every_language -q

      - run: npm run test
        working-directory: frontend
