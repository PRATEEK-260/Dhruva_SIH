# English reason templates, composed rather than enumerated.
#
# A rendered sentence is:  band opener + evidence + modifier clause + notice
#
# All four are COMPLETE SENTENCES joined with a space, never fragments spliced
# into one sentence. That is what makes this safe across SOV languages like Tamil
# and Telugu: each piece is independently well-formed, so no piece has to know
# the word order of the piece beside it.
#
# ~25 authored strings per language instead of 69. That matters because
# machine-authored safety text has to be checked by a native speaker before a
# crew acts on it, and a reviewer will actually finish 25.
#
# No literal digits anywhere. Every number arrives through a slot bound to a
# decoded Capsule attribute.
language: en

# ---- the verdict, one per band ------------------------------------------------
band:
  0: Conditions are within limits for your boat.
  1: Take care.
  2: Do not go out.
  3: No advice can be given.

# ---- why, keyed "<band>.<family>" ---------------------------------------------
evidence:
  "0.0": No hazard was recorded.
  "0.1": Waves {wave_hs_m} metres.
  "0.2": Wind {wind_kt} knots.
  "1.0": Conditions are near the limit for your boat.
  "1.1": Waves {wave_hs_m} metres, near the limit for your boat.
  "1.2": Wind {wind_kt} knots, near the limit for your boat.
  "2.0": Conditions are past the limit for your boat.
  "2.1": Waves {wave_hs_m} metres, past the limit for your boat.
  "2.2": Wind {wind_kt} knots, past the limit for your boat.
  "2.3": A cyclone warning is in force near you.
  "2.4": Lightning has been reported near you.
  "2.5": A tsunami alert is in force. Move away from the shore.
  "3.0": Conditions could not be confirmed. Seek the official bulletin before going out.
  "3.6": A reading needed for the verdict was not available. Seek the official bulletin before going out.

# ---- the secondary clause. Modifier 0 adds nothing. ---------------------------
modifier:
  1: This reading is at the top of its scale. Take it as at least that much.
  2: You are {bnd_dist_nm} nautical miles from {bnd_type_name}, about {bnd_eta_min} minutes at your present drift.
  3: A fishing zone lies {pfz_dist_nm} nautical miles {pfz_bearing_name}.
  4: A fishing zone is nearby, but conditions come first.
  5: Return to the nearest harbour now.
  6: These limits are provisional and are not official criteria.
