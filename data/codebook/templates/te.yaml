language: te
band:
  0: మీ పడవకు పరిస్థితి పరిమితిలోనే ఉంది.
  1: జాగ్రత్తగా ఉండండి.
  2: సముద్రంలోకి వెళ్లవద్దు.
  3: ఎటువంటి సలహా ఇవ్వలేము.
evidence:
  "0.0": ఎటువంటి ప్రమాదం నమోదు కాలేదు.
  "0.1": అల ఎత్తు {wave_hs_m} మీటర్లు.
  "0.2": గాలి {wind_kt} నాట్లు.
  "1.0": పరిస్థితి మీ పడవ పరిమితికి దగ్గరగా ఉంది.
  "1.1": అల ఎత్తు {wave_hs_m} మీటర్లు, మీ పడవ పరిమితికి దగ్గరగా.
  "1.2": గాలి {wind_kt} నాట్లు, మీ పడవ పరిమితికి దగ్గరగా.
  "2.0": పరిస్థితి మీ పడవ పరిమితిని దాటింది.
  "2.1": అల ఎత్తు {wave_hs_m} మీటర్లు, మీ పడవ పరిమితిని దాటింది.
  "2.2": గాలి {wind_kt} నాట్లు, మీ పడవ పరిమితిని దాటింది.
  "2.3": మీ దగ్గర తుఫాను హెచ్చరిక అమలులో ఉంది.
  "2.4": మీ దగ్గర పిడుగులు నమోదయ్యాయి.
  "2.5": సునామీ హెచ్చరిక అమలులో ఉంది. తీరం నుండి దూరంగా వెళ్లండి.
  "3.0": పరిస్థితిని ధృవీకరించలేకపోయాము. సముద్రంలోకి వెళ్లే ముందు అధికారిక బులెటిన్ చూడండి.
  "3.6": తీర్పుకు అవసరమైన ఒక కొలత అందుబాటులో లేదు. సముద్రంలోకి వెళ్లే ముందు అధికారిక బులెటిన్ చూడండి.
modifier:
  1: ఈ కొలత దాని స్కేలు గరిష్ఠంలో ఉంది. నిజమైన విలువ దీనికంటే ఎక్కువ ఉండవచ్చు.
  2: మీరు {bnd_type_name} నుండి {bnd_dist_nm} నాటికల్ మైళ్ల దూరంలో ఉన్నారు, ప్రస్తుత కదలికలో సుమారు {bnd_eta_min} నిమిషాలు.
  3: చేపల మండలం {pfz_bearing_name} దిశలో {pfz_dist_nm} నాటికల్ మైళ్ల దూరంలో ఉంది.
  4: దగ్గరలో చేపల మండలం ఉంది, కానీ సముద్ర పరిస్థితే ముందు.
  5: వెంటనే దగ్గరి రేవుకు తిరిగి వెళ్లండి.
  6: ఈ పరిమితులు తాత్కాలికమైనవి, అధికారిక ప్రమాణాలు కావు.
