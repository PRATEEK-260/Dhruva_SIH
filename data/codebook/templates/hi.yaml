language: hi
band:
  0: आपकी नाव के लिए स्थिति सीमा के भीतर है।
  1: सावधान रहें।
  2: समुद्र में न जाएँ।
  3: कोई सलाह नहीं दी जा सकती।
evidence:
  "0.0": कोई खतरा दर्ज नहीं हुआ।
  "0.1": लहर की ऊँचाई {wave_hs_m} मीटर।
  "0.2": हवा {wind_kt} नॉट।
  "1.0": स्थिति आपकी नाव की सीमा के पास पहुँच गई है।
  "1.1": लहर की ऊँचाई {wave_hs_m} मीटर, आपकी नाव की सीमा के पास।
  "1.2": हवा {wind_kt} नॉट, आपकी नाव की सीमा के पास।
  "2.0": स्थिति आपकी नाव की सीमा पार कर चुकी है।
  "2.1": लहर की ऊँचाई {wave_hs_m} मीटर, आपकी नाव की सीमा से अधिक।
  "2.2": हवा {wind_kt} नॉट, आपकी नाव की सीमा से अधिक।
